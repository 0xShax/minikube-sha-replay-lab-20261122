name: Source-faithful minikube approval replay

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  STATUS_CONTEXT: Kicbase / build
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  observer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record pull request event
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'observer_at=%s\naction=%s\nhead_sha=%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')" "$EVENT_ACTION" "$EVENT_HEAD_SHA"

  source-faithful-check:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'ok-to-build-image') &&
      (
        github.event.comment.user.login == 'minikube-bot' ||
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-pr-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Verify comment author is in OWNERS
        if: github.event_name == 'issue_comment' && github.event.comment.user.login != 'minikube-bot' && github.event.comment.author_association != 'OWNER'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/OWNERS" -H "Accept: application/vnd.github.raw" | yq '.reviewers[], .approvers[]' | grep -qix "${COMMENT_USER}"; then
            echo "User ${COMMENT_USER} is not in OWNERS reviewers or approvers" && exit 1
          fi

      - name: Validate input
        id: input
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          case "${PR_NUMBER}" in
            '' | *[!0-9]*)
              echo "::error::Invalid PR number '${PR_NUMBER}': expected a number" && exit 1
              ;;
          esac
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record real issue_comment event and authorization
        env:
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "$GITHUB_EVENT_PATH" evidence/issue-comment-event.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" > evidence/comment-api.json
          jq -n \
            --arg event_name "$GITHUB_EVENT_NAME" --arg action "$EVENT_ACTION" \
            --arg login "$COMMENT_LOGIN" --arg association "$COMMENT_ASSOCIATION" \
            --arg body "$COMMENT_BODY" \
            --argjson is_pr '${{ github.event.issue.pull_request != null }}' \
            --argjson job_gate_authorized '${{ github.event.comment.user.login == 'minikube-bot' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) }}' \
            '{event_name:$event_name,action:$action,is_pull_request:$is_pr,
              comment:{login:$login,author_association:$association,body:$body},
              job_gate_authorized:$job_gate_authorized,
              owners_step_required:($login != "minikube-bot" and $association != "OWNER")}' \
            > evidence/authorization.json

      # This is test orchestration only. It gives the controller a precise point
      # immediately before minikube's unchanged Resolve and verify PR head logic.
      - name: Race synchronization barrier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          READY_CONTEXT="replay-lab/ready-${COMMENT_ID}"
          GO_CONTEXT="replay-lab/go-${COMMENT_ID}"
          gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$READY_CONTEXT" -f description='source check ready'
          for i in $(seq 1 600); do
            if gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/statuses?per_page=100" \
              --jq ".[] | select(.context == \"${GO_CONTEXT}\" and .state == \"success\") | .id" | grep -q .; then
              date -u +'%Y-%m-%dT%H:%M:%S.%NZ' > evidence/barrier-released-at.txt
              exit 0
            fi
            sleep 0.10
          done
          echo 'controller did not release race barrier' > evidence/barrier-error.txt
          exit 1

      - name: Resolve and verify PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.input.outputs.pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          now() { date -u +'%Y-%m-%dT%H:%M:%S.%NZ'; }
          fail() {
            local short="$1" detail="${2:-}"
            jq -n --arg decision REJECT --arg reason "$short" --arg detail "$detail" \
              '{decision:$decision,reason:$reason,detail:$detail}' > evidence/decision.json
            echo "failure_reason=$short" >> "$GITHUB_OUTPUT"
            echo "::error::$short $detail"
            exit 1
          }

          PR_VIEW_STARTED_AT="$(now)"
          HEAD_VIEW_JSON="$(gh pr view "${PR_NUMBER}" --json headRefOid)"
          printf '%s\n' "$HEAD_VIEW_JSON" > evidence/gh-pr-view-head-resolution.json
          HEAD_SHA="$(jq -r .headRefOid <<<"$HEAD_VIEW_JSON")"
          REPO_VIEW_JSON="$(gh pr view "${PR_NUMBER}" --json headRepositoryOwner,headRepository)"
          printf '%s\n' "$REPO_VIEW_JSON" > evidence/gh-pr-view-repository-resolution.json
          PR_REPO="$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<<"$REPO_VIEW_JSON")"
          PR_VIEW_RECEIVED_AT="$(now)"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="${STATUS_CONTEXT}" -f target_url="${RUN_URL}" \
            -f description="Building kicbase image..."

          APPROVED_SHA=$(echo "${COMMENT_BODY}" | tr -d '\r' | awk '/ok-to-build-image/ {print $2; exit}')
          OLD_EXAMPLE_APPROVED_SHA=$(printf '%s\n' 'ok-to-build-image open replay M' | awk '/ok-to-build-image/ {print $2; exit}')
          jq -n --arg comment_body "$COMMENT_BODY" --arg approved_sha "$APPROVED_SHA" \
            --arg old_example_approved_sha "$OLD_EXAMPLE_APPROVED_SHA" --arg head_sha "$HEAD_SHA" \
            '{comment_body:$comment_body,approved_sha:$approved_sha,head_sha:$head_sha,
              selected_path:(if $approved_sha == "" then "unpinned-timestamp" else "explicit-sha" end),
              prior_harness_control:{comment:"ok-to-build-image open replay M",
                parsed_approved_sha:$old_example_approved_sha,
                would_match_head:($old_example_approved_sha == $head_sha)}}' \
            > evidence/comment-parsing.json

          LATE_FORCE_PUSH='not-queried-explicit-path'
          LAST_PUSHED_AT='not-queried-explicit-path'
          if [ -n "${COMMENT_BODY}" ] && [ "${PR_REPO}" != "minikube-bot/minikube" ]; then
            if [ -n "${APPROVED_SHA}" ]; then
              if [ "${HEAD_SHA}" != "${APPROVED_SHA}" ]; then
                fail "PR head does not match the approved SHA; comment ok-to-build-image again" "head=${HEAD_SHA} approved=${APPROVED_SHA}"
              fi
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
                > evidence/pr-events.json
              LATE_FORCE_PUSH=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq ".[] | select(.event == \"head_ref_force_pushed\" and .created_at > \"${COMMENT_AT}\") | .created_at" | head -n1)
              if [ -n "${LATE_FORCE_PUSH}" ]; then
                fail "PR was force pushed after the approval comment; comment ok-to-build-image again" "force_pushed=${LATE_FORCE_PUSH} comment=${COMMENT_AT}"
              fi
              RUNS_REQUEST_STARTED_AT="$(now)"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
                > evidence/runs-api.json
              RUNS_RESPONSE_RECEIVED_AT="$(now)"
              LAST_PUSHED_AT=$(jq -r '[.workflow_runs[].created_at] | max // empty' evidence/runs-api.json)
              if [ -z "${LAST_PUSHED_AT}" ]; then
                fail "Could not determine when the PR head was pushed; comment ok-to-build-image ${HEAD_SHA:0:12}" "head=${HEAD_SHA} (no pull_request workflow runs found)"
              fi
              if [ "${LAST_PUSHED_AT}" \> "${COMMENT_AT}" ]; then
                fail "PR head was pushed after the approval comment; comment ok-to-build-image again" "head=${HEAD_SHA} pushed=${LAST_PUSHED_AT} comment=${COMMENT_AT}"
              fi
            fi
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/replay-pr" > evidence/branch-ref.json
          git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/pull/${PR_NUMBER}/head" \
            > evidence/pull-ref-ls-remote.txt
          FETCH_STARTED_AT="$(now)"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git checkout --detach "${HEAD_SHA}"
          CHECKOUT_COMPLETED_AT="$(now)"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MARKER="$(cat marker.txt)"

          jq -n \
            --arg decision ACCEPT --arg reason source-faithful-check-passed \
            --arg comment_at "$COMMENT_AT" --arg comment_body "$COMMENT_BODY" \
            --arg approved_sha "$APPROVED_SHA" --arg head_sha "$HEAD_SHA" --arg pr_repo "$PR_REPO" \
            --arg late_force_push "$LATE_FORCE_PUSH" --arg last_pushed_at "$LAST_PUSHED_AT" \
            --arg pr_view_started_at "$PR_VIEW_STARTED_AT" --arg pr_view_received_at "$PR_VIEW_RECEIVED_AT" \
            --arg runs_request_started_at "${RUNS_REQUEST_STARTED_AT:-not-run}" \
            --arg runs_response_received_at "${RUNS_RESPONSE_RECEIVED_AT:-not-run}" \
            --arg fetch_started_at "$FETCH_STARTED_AT" --arg checkout_completed_at "$CHECKOUT_COMPLETED_AT" \
            --arg checked_out_sha "$CHECKED_OUT_SHA" --arg marker "$MARKER" \
            '{decision:$decision,reason:$reason,comment_at:$comment_at,comment_body:$comment_body,
              approved_sha:$approved_sha,head_sha:$head_sha,pr_repo:$pr_repo,
              late_force_push:$late_force_push,last_pushed_at:$last_pushed_at,
              pr_view_started_at:$pr_view_started_at,pr_view_received_at:$pr_view_received_at,
              runs_request_started_at:$runs_request_started_at,
              runs_response_received_at:$runs_response_received_at,
              fetch_started_at:$fetch_started_at,checkout_completed_at:$checkout_completed_at,
              checked_out_sha:$checked_out_sha,marker:$marker}' > evidence/decision.json
          cat evidence/decision.json

      - name: Upload source-faithful evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: source-faithful-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 1

  controller:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '1'
      LAB_BRANCH: replay-pr
      B_SHA: aaef844c81ae53fc46632964d4186bb889a5554d
      M_SHA: 0909609fefe17479553fec179be97369e1abaa0d
    steps:
      - name: Prepare and orchestrate source-faithful race
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p controller-evidence
          REPO="$GITHUB_REPOSITORY"
          now() { date -u +'%Y-%m-%dT%H:%M:%S.%NZ'; }
          api() { gh api -H 'Accept: application/vnd.github+json' "$@"; }

          STARTED_AT="$(now)"
          MAIN_SHA="$(api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          M_PARENT="$(api "repos/${REPO}/git/commits/${M_SHA}" --jq '.parents[0].sha')"
          if [ "$M_PARENT" != "$B_SHA" ]; then
            echo "M is not a direct child of B" >&2
            exit 1
          fi
          jq -n --arg started_at "$STARTED_AT" --arg main "$MAIN_SHA" \
            --arg b "$B_SHA" --arg m "$M_SHA" --arg m_parent "$M_PARENT" \
            '{started_at:$started_at,main:$main,B:$b,M:$m,M_parent:$m_parent}' \
            > controller-evidence/revisions.json

          RESET_STARTED_AT="$(now)"
          api -X PATCH "repos/${REPO}/git/refs/heads/${LAB_BRANCH}" -f sha="$B_SHA" -F force=true \
            > controller-evidence/reset-to-B-response.json
          RESET_RECEIVED_AT="$(now)"
          jq -n --arg started_at "$RESET_STARTED_AT" --arg received_at "$RESET_RECEIVED_AT" \
            '{request_started_at:$started_at,response_received_at:$received_at}' \
            > controller-evidence/reset-to-B-timing.json

          for i in $(seq 1 300); do
            CURRENT="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            if [ "$CURRENT" = "$B_SHA" ]; then
              jq -n --arg observed_at "$(now)" --arg head_sha "$CURRENT" \
                '{observed_at:$observed_at,head_sha:$head_sha}' \
                > controller-evidence/B-head-visible.json
              break
            fi
            sleep 0.10
          done
          if [ ! -s controller-evidence/B-head-visible.json ]; then
            echo 'PR head B never became visible' >&2
            exit 1
          fi

          printf 'Waiting for repository owner to post exact comment: ok-to-build-image\n'
          COMMENT_JSON=''
          for i in $(seq 1 1800); do
            COMMENT_JSON="$(api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" | \
              jq -c --arg started "$STARTED_AT" \
              '[.[] | select(.body == "ok-to-build-image" and .created_at >= $started)] | last // empty')"
            if [ -n "$COMMENT_JSON" ]; then break; fi
            sleep 0.25
          done
          if [ -z "$COMMENT_JSON" ]; then
            echo 'exact owner comment did not arrive' >&2
            exit 1
          fi
          printf '%s\n' "$COMMENT_JSON" > controller-evidence/exact-comment.json
          COMMENT_ID="$(jq -r .id <<<"$COMMENT_JSON")"
          COMMENT_AT="$(jq -r .created_at <<<"$COMMENT_JSON")"
          COMMENT_ASSOCIATION="$(jq -r .author_association <<<"$COMMENT_JSON")"
          if [[ "$COMMENT_ASSOCIATION" != OWNER && "$COMMENT_ASSOCIATION" != MEMBER && "$COMMENT_ASSOCIATION" != COLLABORATOR ]]; then
            echo "comment author was not authorized: $COMMENT_ASSOCIATION" >&2
            exit 1
          fi

          READY_CONTEXT="replay-lab/ready-${COMMENT_ID}"
          for i in $(seq 1 1200); do
            READY_ID="$(api "repos/${REPO}/commits/${MAIN_SHA}/statuses?per_page=100" \
              --jq ".[] | select(.context == \"${READY_CONTEXT}\" and .state == \"pending\") | .id" | head -n1)"
            if [ -n "$READY_ID" ]; then
              jq -n --arg observed_at "$(now)" --arg id "$READY_ID" --arg context "$READY_CONTEXT" \
                '{observed_at:$observed_at,status_id:($id|tonumber),context:$context}' \
                > controller-evidence/source-check-ready.json
              break
            fi
            sleep 0.10
          done
          if [ ! -s controller-evidence/source-check-ready.json ]; then
            echo 'source-faithful issue_comment job never reached barrier' >&2
            exit 1
          fi

          MOVE_STARTED_AT="$(now)"
          api -X PATCH "repos/${REPO}/git/refs/heads/${LAB_BRANCH}" -f sha="$M_SHA" -F force=false \
            > controller-evidence/fast-forward-to-M-response.json
          MOVE_RECEIVED_AT="$(now)"
          jq -n --arg started_at "$MOVE_STARTED_AT" --arg received_at "$MOVE_RECEIVED_AT" \
            '{request_started_at:$started_at,response_received_at:$received_at}' \
            > controller-evidence/fast-forward-to-M-timing.json

          for i in $(seq 1 600); do
            RESOLVED_HEAD="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            if [ "$RESOLVED_HEAD" = "$M_SHA" ]; then
              jq -n --arg observed_at "$(now)" --arg head_sha "$RESOLVED_HEAD" \
                '{observed_at:$observed_at,head_sha:$head_sha,operation:"gh pr view --json headRefOid"}' \
                > controller-evidence/M-head-visible-via-gh-pr-view.json
              break
            fi
            sleep 0.05
          done
          if [ ! -s controller-evidence/M-head-visible-via-gh-pr-view.json ]; then
            echo 'gh pr view did not resolve M after branch update' >&2
            exit 1
          fi

          GO_POST_STARTED_AT="$(now)"
          api --silent -X POST "repos/${REPO}/statuses/${MAIN_SHA}" \
            -f state=success -f context="replay-lab/go-${COMMENT_ID}" -f description='branch moved to restored M'
          GO_POST_RECEIVED_AT="$(now)"
          jq -n --arg started_at "$GO_POST_STARTED_AT" --arg received_at "$GO_POST_RECEIVED_AT" \
            '{request_started_at:$started_at,response_received_at:$received_at}' \
            > controller-evidence/go-status-timing.json

          api "repos/${REPO}/pulls/${PR_NUMBER}" > controller-evidence/pr-after-move.json
          api "repos/${REPO}/git/ref/heads/${LAB_BRANCH}" > controller-evidence/branch-ref-after-move.json
          git ls-remote "https://github.com/${REPO}.git" "refs/pull/${PR_NUMBER}/head" \
            > controller-evidence/pull-ref-after-move.txt

          for i in $(seq 1 1200); do
            RUNS="$(api "repos/${REPO}/actions/workflows/replay-lab.yml/runs?event=issue_comment&per_page=20")"
            SOURCE_RUN_ID="$(jq -r --arg comment_at "$COMMENT_AT" \
              '[.workflow_runs[] | select(.created_at >= $comment_at)] | first | .id // empty' <<<"$RUNS")"
            SOURCE_STATUS="$(jq -r --argjson id "${SOURCE_RUN_ID:-0}" \
              '.workflow_runs[] | select(.id == $id) | .status // empty' <<<"$RUNS")"
            if [ -n "$SOURCE_RUN_ID" ] && [ "$SOURCE_STATUS" = completed ]; then
              printf '%s\n' "$RUNS" > controller-evidence/issue-comment-runs-completed.json
              printf '%s\n' "$SOURCE_RUN_ID" > controller-evidence/source-run-id.txt
              break
            fi
            sleep 0.25
          done

          for i in $(seq 1 1200); do
            M_RUNS="$(api "repos/${REPO}/actions/runs?head_sha=${M_SHA}&event=pull_request&per_page=100")"
            NEW_COUNT="$(jq --arg comment_at "$COMMENT_AT" '[.workflow_runs[] | select(.created_at > $comment_at)] | length' <<<"$M_RUNS")"
            if [ "$NEW_COUNT" -gt 0 ]; then
              jq -n --arg observed_at "$(now)" --arg comment_at "$COMMENT_AT" \
                --argjson response "$M_RUNS" \
                '{observed_at:$observed_at,comment_at:$comment_at,response:$response}' \
                > controller-evidence/new-M-run-first-visible.json
              break
            fi
            sleep 0.10
          done

      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: source-faithful-controller-${{ github.run_id }}
          path: controller-evidence/
          if-no-files-found: warn
          retention-days: 1
